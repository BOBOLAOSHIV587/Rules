^https?:\/\/app\.bili(bili\.com|api\.net)\/x\/v2\/region\/index\? url script-response-body https://raw.githubusercontent.com/BOBOLAOSHIV587/Rules/main/JS/BiliUniverse/Enhanced/JS/response.bundle.js
