#!name =  iRingo: 🌤 WeatherKit
#!desc = iOS 18 & macOS 15 & watchOS 11\n1.解锁全部天气功能\n2.替换空气质量数据\n3.添加下一小时降水数据\n4.添加天气数据
#!date=2026-08-09
#!category =  iRingo
#!author = VirgilClyne[https://github.com/VirgilClyne],WordlessEcho[https://github.com/WordlessEcho],001[https://github.com/001ProMax]
#!homepage = https://NSRingo.github.io/guide/Weather/weather-kit
#!icon = https://raw.githubusercontent.com/BOBOLAOSHIV587/Rules/main/Icons/AppIcons/Image/IMG/iRingo/WeatherKit.png
#!openUrl = http://boxjs.com/#/app/iRingo.WeatherKit


[filter_local]
host, weather-analytics-events.apple.com, reject
host-suffix, tthr.apple.com, reject
host, tether.edge.apple, reject

[rewrite_local]
# 🌤 WeatherKit.api.v1.availability.response
^https?:\/\/weatherkit\.apple\.com\/api\/v1\/availability\/ url script-response-body https://raw.githubusercontent.com/BOBOLAOSHIV587/Rules/main/JS/iRingo/WeatherKit/JS/JS-1/response.bundle.js
# 🌤 WeatherKit.api.v1.weatherAlerts.response
^https?:\/\/weatherkit\.apple\.com\/api\/v1\/weatherAlerts\?[^#]*&ids=-?[0-9]+(?:\.[0-9]+)?,-?[0-9]+(?:\.[0-9]+)?(?:&|$) url script-echo-response https://raw.githubusercontent.com/BOBOLAOSHIV587/Rules/main/JS/iRingo/WeatherKit/JS/JS-1/request.bundle.js
# 🌤 WeatherKit.api.v2.weather.response
^https?:\/\/weatherkit\.apple\.com\/api\/v2\/weather\/ url script-response-body https://raw.githubusercontent.com/BOBOLAOSHIV587/Rules/main/JS/iRingo/WeatherKit/JS/JS-1/response.bundle.js

[mitm]
hostname = weatherkit.apple.com
