[rewrite_local]
# 获取凭据 (当访问海角 API 接口时自动触发保存)
^https:\/\/www\.haijiao\.com\/api\/ url script-request-header https://raw.githubusercontent.com/BOBOLAOSHIV587/Rules/main/Task/HaiJiao/JS/Get-Cookie.js

[task_local]
# 定时签到 (每日 08:50 自动执行)
50 8 * * * https://raw.githubusercontent.com/BOBOLAOSHIV587/Rules/main/Task/HaiJiao/JS/CheckIn.js, tag=海角签到, enabled=true

[mitm]
hostname = www.haijiao.com
